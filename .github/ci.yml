name: CI

# Run on every push to any branch, and on every pull request into main,
# so a PR can't be merged with a broken build or failing tests.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # lets you re-run it manually from the Actions tab

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: macos-latest      # most of the group develops on Macs
            compiler: apple-clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure (CMake)
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure (generates compile_commands.json)
        run: cmake -S . -B build

      - name: Run clang-tidy on game sources
        # Warnings are reported but don't fail the build, as in the lecture's flake8 example.
        run: clang-tidy -p build game.cpp main.cpp || true
